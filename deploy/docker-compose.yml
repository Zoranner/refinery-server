services:
  refinery:
    image: ghcr.io/zoranner/refinery:0.1.0
    container_name: refinery
    restart: always
    depends_on:
      - reader
      - searxng
    ports:
      - 8080:8080
    environment:
      - REFINERY_BIND=0.0.0.0
      - REFINERY_PORT=8080
      - SEARXNG_BASE_URL=http://searxng:8888
      - READER_BASE_URL=http://reader:8081
  reader:
    image: ghcr.io/jina-ai/reader:oss
    container_name: refinery-reader
    restart: always
  searxng:
    image: searxng/searxng:latest
    restart: always
    environment:
      - SEARXNG_SETTINGS_FILE=/etc/searxng/settings.yml
    volumes:
      - ./app/settings.yml:/etc/searxng/settings.yml:ro
networks:
  default:
    external: true
    name: refinery
